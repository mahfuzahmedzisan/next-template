name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders so the build doesn't fail on missing
          # required env vars. Replace with real secrets for deployment.
          LARAVEL_API_URL: http://127.0.0.1:8000
          BFF_SECRET: ci-placeholder-secret-ci-placeholder-secret
          SESSION_SECRET: ci-placeholder-secret-ci-placeholder-secret
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
