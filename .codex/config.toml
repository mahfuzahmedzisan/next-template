[mcp_servers.motion]
type = "http"
url = "https://mcp.motion.dev"

[mcp_servers.motion-plus]
type = "http"
url = "https://mcp.motion.dev/plus"

[mcp_servers.next-devtools]
command = "npx"
args = [
    "-y",
    "next-devtools-mcp@latest",
]

[mcp_servers.shadcn]
command = "npx"
args = [
    "shadcn@latest",
    "mcp",
]
